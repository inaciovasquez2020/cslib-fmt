name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          source "$HOME/.elan/env"
          lean --version
          lake --version

      - name: Fetch Mathlib cache
        run: |
          lake update
          for attempt in 1 2 3; do
            lake exe cache get && break
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Direct-check isolated automorphism lemma
        run: |
          lake env lean lean/CSLIB/FMT/UnguardedFO/LocalityInputSurface.lean
          cp lean/CSLIB/FMT/UnguardedFO/LocalityInputSurface.lean "$RUNNER_TEMP/LocalityInputSurfaceAxiomAudit.lean"
          printf '\n#print axioms CSLIB.FMT.UnguardedFO.pointed_neighborhood_equiv_full_carrier_automorphism\n#print axioms CSLIB.FMT.UnguardedFO.local_pointed_back_and_forth_enumerating_extension\n#print axioms CSLIB.FMT.UnguardedFO.local_pointed_back_and_forth_finite_automorphism\n#print axioms CSLIB.FMT.UnguardedFO.rankIndexedEF_preserves_equality_atom\n#print axioms CSLIB.FMT.UnguardedFO.rankIndexedEF_preserves_relation_atom\n#print axioms CSLIB.FMT.UnguardedFO.rankIndexedEF_of_le\n#print axioms CSLIB.FMT.UnguardedFO.rankIndexedEF_preserves_bounded_formula\n#print axioms CSLIB.FMT.UnguardedFO.pointed_neighborhood_equiv_implies_rank_zero_EF\n' >> "$RUNNER_TEMP/LocalityInputSurfaceAxiomAudit.lean"
          lake env lean "$RUNNER_TEMP/LocalityInputSurfaceAxiomAudit.lean"

      - name: Build
        run: lake build
