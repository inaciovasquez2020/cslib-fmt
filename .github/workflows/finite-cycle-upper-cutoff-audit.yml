name: Finite cycle upper cutoff spanning audit
"on":
  pull_request:
    paths:
      - 'lean/CSLIB/FMT/UnguardedFO/FiniteCycleUpperCutoffCandidate.lean'
      - '.github/workflows/finite-cycle-upper-cutoff-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Upper cutoff source-locked Lean and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0-rc1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0c154d67103f74be3a0f2c509f72ccbf5be9f2a7'
          SRC='lean/CSLIB/FMT/UnguardedFO/FiniteCycleUpperCutoffCandidate.lean'
          test "$(git hash-object "$SRC")" = '89650442ef77f5c9d22f6ae49e865b3cc161a72b'
          lake build CSLIB.FMT.UnguardedFO.FiniteCycleConcreteEntropyCandidate
          lake env lean "$SRC" 2>&1 | tee "$RUNNER_TEMP/upper-cutoff.log"
          python3 - "$RUNNER_TEMP/upper-cutoff.log" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          name='CSLIB.FMT.UnguardedFO.cycleConcreteBoundedSupport_eq_top'
          m=re.findall(r"^'"+re.escape(name)+r"' (?:does not depend on any axioms|depends on axioms: \[([^\]]*)\])\s*$",s,re.M)
          if len(m)!=1:
              raise SystemExit('MISSING_AXIOM_REPORT')
          axs={x.strip() for x in m[0].split(',') if x.strip()}
          if not axs <= {'propext','Classical.choice','Quot.sound'}:
              raise SystemExit('UNEXPECTED_AXIOMS: '+str(axs))
          print('LEAN_VERIFIED_ISOLATED',name,sorted(axs))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle-upper-cutoff-audit-log
          path: ${{ runner.temp }}/upper-cutoff.log
