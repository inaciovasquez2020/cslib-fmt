name: Finite cycle signed edge transport audit
"on":
  pull_request:
    paths:
      - 'lean/CSLIB/FMT/UnguardedFO/FiniteCycleSignedTransportCandidate.lean'
      - '.github/workflows/finite-cycle-signed-transport-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Pinned signed transport compilation and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0-rc1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0c154d67103f74be3a0f2c509f72ccbf5be9f2a7'
          D="$RUNNER_TEMP/cslib-signed-edge-transport"
          mkdir -p "$D"
          git rev-parse HEAD > "$D/head.txt"
          SRC='lean/CSLIB/FMT/UnguardedFO/FiniteCycleSignedTransportCandidate.lean'
          printf '%s  %s\n' 'baf365f50bbdac03f4175a1f1a87f38196ec7f8c894e5cd46e58df5f5550f0eb' "$SRC" | sha256sum --check
          sha256sum "$SRC" > "$D/source.sha256"
          lake build CSLIB.FMT.UnguardedFO.FiniteCycleOrderedEdgeEquivCandidate 2>&1 | tee "$D/dependency.log"
          lake env lean "$SRC" 2>&1 | tee "$D/lean.log"
          python3 - "$D/lean.log" <<'PY'
          import re, sys
          log = open(sys.argv[1], encoding='utf-8').read()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for name in ('cycleSignedTransport', 'cycleSignedTransport_ne_zero_iff'):
              full = 'CSLIB.FMT.UnguardedFO.' + name
              pattern = r"^'" + re.escape(full) + r"' (?:does not depend on any axioms|depends on axioms: \[([^\]]*)\])\s*$"
              matches = list(re.finditer(pattern, log, re.MULTILINE))
              if len(matches) != 1:
                  raise SystemExit('MISSING_AXIOM_REPORT: '+full)
              raw = matches[0].group(1)
              axioms = set() if raw is None else {a.strip() for a in raw.split(',') if a.strip()}
              if not axioms <= allowed:
                  raise SystemExit('UNEXPECTED_AXIOMS '+full+': '+repr(sorted(axioms - allowed)))
              print('LEAN_VERIFIED_ISOLATED', full, sorted(axioms))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-transport-lean-receipt
          path: ${{ runner.temp }}/cslib-signed-edge-transport/
