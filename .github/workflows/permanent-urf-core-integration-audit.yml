name: Permanent URF core dependency integration audit
"on":
  pull_request:
    paths:
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean/CSLIB/FMT/UnguardedFO/ImportedSharpCliqueEntropy.lean'
      - '.github/workflows/permanent-urf-core-integration-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Verify pinned direct dependency and compiled concrete entropy
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0-rc1'
          test "$(git hash-object lean/CSLIB/FMT/UnguardedFO/ImportedSharpCliqueEntropy.lean)" = '4705612542d847f2787aa0dda3c43739cd52ba0b'
          timeout 300 lake update 2>&1 | tee "$RUNNER_TEMP/permanent-update.log"
          test "$(git -C .lake/packages/urf_core rev-parse HEAD)" = '422294157daa95a8e7d95a0ce79caf5492821a9c'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0c154d67103f74be3a0f2c509f72ccbf5be9f2a7'
          timeout 1200 lake build CSLIB.FMT.UnguardedFO.FiniteCycleSharpEntropyCandidate 2>&1 | tee "$RUNNER_TEMP/permanent-lean.log"
          timeout 1200 lake build CSLIB 2>&1 | tee -a "$RUNNER_TEMP/permanent-lean.log"
          cat > "$RUNNER_TEMP/DirectDependencyAxioms.lean" <<'LEAN'
          import CSLIB.FMT.UnguardedFO.FiniteCycleSharpEntropyCandidate
          #print axioms URF.EntropyBridge.linear_uniform_conditional_entropy_exact_candidate
          #print axioms CSLIB.FMT.UnguardedFO.cycleConcreteEntropy_sharp
          LEAN
          lake env lean "$RUNNER_TEMP/DirectDependencyAxioms.lean" 2>&1 | tee "$RUNNER_TEMP/permanent-axioms.log"
          python3 - "$RUNNER_TEMP/permanent-axioms.log" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          for name in ('URF.EntropyBridge.linear_uniform_conditional_entropy_exact_candidate',
                       'CSLIB.FMT.UnguardedFO.cycleConcreteEntropy_sharp'):
              matching=[line for line in s.splitlines() if ("'"+name+"' depends on axioms:") in line]
              if len(matching)!=1:
                  raise SystemExit('AXIOM_REPORT_COUNT_FAIL: '+name+' '+str(len(matching)))
              m=re.search(r'\[([^\]]*)\]',matching[0].split('depends on axioms:',1)[1])
              if m is None:
                  raise SystemExit('AXIOM_PARSE_FAIL: '+name)
              ax={x.strip() for x in m.group(1).split(',') if x.strip()}
              if not ax <= {'propext','Classical.choice','Quot.sound'}:
                  raise SystemExit('FORBIDDEN_AXIOS: '+name+' '+repr(ax))
              print('DIRECT_IMPORT_AXIOMS_PASS',name,sorted(ax))
          PY
          echo 'PERMANENT_DEPENDENCY_INTEGRATION := PASS'
          echo 'MANIFEST_SHA256 := ' "$(sha256sum lake-manifest.json | cut -d' ' -f1)"
          git diff -- lake-manifest.json
      - name: Preserve integration receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: permanent-urf-integration-logs
          path: ${{ runner.temp }}/permanent-*.log
