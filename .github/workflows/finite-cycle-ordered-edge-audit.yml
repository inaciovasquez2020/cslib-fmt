name: Finite cycle ordered-edge equivalence audit
"on":
  pull_request:
    paths:
      - 'lean/CSLIB/FMT/UnguardedFO/FiniteCycleOrderedEdgeEquivCandidate.lean'
      - '.github/workflows/finite-cycle-ordered-edge-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Pinned source and theorem compilation
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.30.0-rc1'
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0c154d67103f74be3a0f2c509f72ccbf5be9f2a7'
          D="$RUNNER_TEMP/cslib-ordered-edge-equiv"
          mkdir -p "$D"
          echo "$GITHUB_SHA" > "$D/head.txt"
          SRC='lean/CSLIB/FMT/UnguardedFO/FiniteCycleOrderedEdgeEquivCandidate.lean'
          printf '%s  %s\n' 'e8039fa691d6b13171feb4fa3e7b7f167f5df838b11493358c86df06d938ca73' "$SRC" | sha256sum --check
          sha256sum "$SRC" > "$D/source.sha256"
          lake build CSLIB.FMT.UnguardedFO.FiniteCycleSimpleGraph 2>&1 | tee "$D/dependency.log"
          lake env lean "$SRC" 2>&1 | tee "$D/lean.log"
          python3 - "$D/lean.log" <<'PY'
          import re, sys
          log = open(sys.argv[1], encoding='utf-8').read()
          name = 'CSLIB.FMT.UnguardedFO.cycleOrderedEdgeEquiv'
          pattern = r"^'" + re.escape(name) + r"' (?:does not depend on any axioms|depends on axioms: \[([^\]]*)\])\s*$"
          matches = list(re.finditer(pattern, log, re.MULTILINE))
          if len(matches) != 1:
              raise SystemExit('INCOMPLETE_OR_MISSING_AXIOM_AUDIT: '+str(len(matches)))
          evidence = matches[0].group(1)
          axioms = set() if evidence is None else {a.strip() for a in evidence.split(',') if a.strip()}
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          if not axioms <= allowed:
              raise SystemExit('UNEXPECTED_AXIOMS: '+repr(sorted(axioms - allowed)))
          print('LEAN_VERIFIED_ISOLATED cycleOrderedEdgeEquiv')
          print('AXIOMS:', sorted(axioms))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ordered-edge-equiv-lean-receipt
          path: ${{ runner.temp }}/cslib-ordered-edge-equiv/
