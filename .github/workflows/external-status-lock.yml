name: external-status-lock

on:
  push:
  pull_request:

jobs:
  external-status-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify external status lock
        run: python3 scripts/verify_external_status_lock.py
      - name: Verify existential locality radius input surface theorem
        run: python3 tools/verify_ex_has_unguarded_fo_locality_radius_to_exists_input_surface.py
      - name: Verify finite subset union bound local closure receipt
        run: python3 tools/verify_finite_subset_union_bound_local_closure_receipt.py
      - name: Verify zero-ary relation negative boundary regression receipt
        run: python3 tools/verify_zero_ary_relation_negative_boundary_regression_receipt.py
      - name: Verify T_ext back-and-forth completeness regression receipt
        run: python3 tools/verify_t_ext_back_and_forth_completeness_regression_receipt.py
