name: Publish CSLIB-FMT status release 2026-11-06
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-cslib-fmt-status-2026-11-06.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'inaciovasquez2020/cslib-fmt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create separate dated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="cslib-fmt-status-update-2026-11-06"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "DATED_RELEASE := ALREADY_PRESENT"
            exit 0
          fi
          gh release create "$tag" \
            --target "613ac2adc91dc3882671bc52ba04db12eefda691" \
            --title "CSLIB-FMT public status update — 2026-11-06" \
            --notes-file "docs/status/CSLIB_FMT_PUBLIC_STATUS_UPDATE_2026_11_06.md"
          echo "DATED_RELEASE := CREATED"
